name: Bilbevakning

"on":
  schedule:
    # Körs varje timme (UTC). Justera vid behov, t.ex. "0 */2 * * *" för varannan timme.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # gör att du kan trycka "Run workflow" manuellt i GitHub-gränssnittet

permissions:
  contents: write  # workflowen behöver kunna committa tillbaka den uppdaterade resultatsidan

concurrency:
  group: bilbevakning
  cancel-in-progress: false

jobs:
  sok:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera blocket-api
        run: pip install blocket-api

      - name: Kör bilbevakningen
        run: python3 bilbevakning_cloud.py --once

      - name: Committa uppdaterad resultatsida
