name: Bilbevakning

"on":
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bilbevakning
  cancel-in-progress: false

jobs:
  sok:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera blocket-api
        run: pip install blocket-api

      - name: Kör bilbevakningen
        run: python3 bilbevakning_cloud.py --once

      - name: Committa uppdaterad resultatsida
        run: |
          git config user.name "bilbevakning-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html sedda_annonser.json
          git diff --staged --quiet || git commit -m "Uppdaterad bilbevakning"
          git push
